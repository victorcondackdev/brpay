name: Pages

# Rebuilds docs/brpay.wasm with the current toolchain (and the matching
# wasm_exec.js) and deploys docs/ to GitHub Pages. In the repository
# settings, set Pages > Source to "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build wasm
        run: |
          GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o docs/brpay.wasm ./wasm
          src="$(go env GOROOT)/lib/wasm/wasm_exec.js"
          [ -f "$src" ] || src="$(go env GOROOT)/misc/wasm/wasm_exec.js"
          cp "$src" docs/wasm_exec.js
          ls -l docs/brpay.wasm
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
